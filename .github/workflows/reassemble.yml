name: Reassemble PTGs archive

on:
  push:
    paths:
      - ".github/workflows/reassemble.yml"

permissions:
  contents: write

jobs:
  reassemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reassemble archive
        shell: bash
        run: |
          cat bundle_parts/*.b64 | tr -d '\n' | base64 --decode > PTGs-GitHub-backup.tar.xz
          echo "c61cec57ec85ff1a59240c82659f3f027df9d75898e14bad09249eafbb05fc4c  PTGs-GitHub-backup.tar.xz" | sha256sum --check

      - name: Commit final archive
        shell: bash
        run: |
          rm -rf bundle_parts archive_parts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add PTGs iOS project archive"
          git push
